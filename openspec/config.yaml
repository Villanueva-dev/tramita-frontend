# openspec/config.yaml — tramita-frontend
schema: spec-driven

context: |
  Stack: Next.js 16.3.5 (App Router) + React 19 + TS 5.7.3 strict + Tailwind 4.
  Arquitectura: estructura idiomática del App Router (app/, components/, lib/), atomic
  design + container/presentational.
  Testing: Vitest 4 + jsdom + @testing-library/react. Hay tests de lógica (lib/*.test.ts) y
  de componentes (app/**/*.test.tsx); sin E2E ni coverage. El inventario y el conteo se miden
  corriendo `pnpm test`; no se transcriben aquí porque son volátiles.
  Principios rectores: KISS + YAGNI, y toda afirmación sobre el repo se sostiene con la
  medición que la produjo, nunca con un dato recordado (docs/constitucion.md).
  Estilo: español en docs/commits/comentarios; identificadores en inglés.
  Backend hermano: Spring Boot 4 en ../Tramita, motor de workflow (002) ya mergeado.
  Detalle completo y brechas de tooling: ver openspec/project.md.

strict_tdd: true

testing:
  strict_tdd_source: "marker (Strict TDD Mode: enabled en CLAUDE.md global) + comando workspace explícito (pnpm test)"
  detected: "2026-09-16"
  projects:
    - relative_path: "."
      stack: "Next.js 16.3.5 + React 19 + TypeScript 5.7.3"
      test_command: "pnpm test"
      test_layers: [unit, integration]
      coverage_command: null
      quality_tools:
        linter: "pnpm lint"
        type_checker: "pnpm exec tsc --noEmit"
        formatter: null
  test_runner:
    command: "pnpm test"
    framework: "vitest ^4.1.11 (vitest run)"
  layers:
    unit:
      available: true
      tool: "vitest"
      note: "lib/*.test.ts — lógica pura y hooks de dominio. Entorno jsdom configurado en vitest.config.mts. Para el inventario vigente, correr `pnpm test`."
    integration:
      available: true
      tool: "vitest + @testing-library/react (entorno jsdom)"
      note: "@testing-library/react ^16.3.2, @testing-library/dom ^10.4.1, jsdom ^30.0.1 y @vitejs/plugin-react ^6.0.5 instalados; vitest.config.mts declara environment jsdom. Hay tests de componentes escritos bajo app/**/*.test.tsx. Para el inventario vigente, correr `pnpm test`."
    e2e:
      available: false
      tool: null
      note: "No hay Playwright ni Cypress instalados (verificado en node_modules/.bin)."
  coverage:
    available: false
    command: null
    note: "No hay @vitest/coverage-v8 (ni equivalente) instalado."
  quality_tools:
    linter:
      available: true
      command: "pnpm lint (eslint .)"
      note: "ESLint 9.39.3 y eslint.config.mjs están presentes. Medición 2026-09-16: `pnpm lint` terminó con código 0."
    type_checker:
      available: true
      command: "pnpm exec tsc --noEmit"
      note: "typescript 5.7.3 instalado, tsconfig.json con strict:true y noEmit:true. Sin script npm dedicado — hay que invocar tsc directo. Gotcha: correr `rm -rf .next` antes, o aparecen TS2307 falsos."
    formatter:
      available: false
      command: null
      note: "No hay Prettier, Biome ni config de formato en el repo (verificado en node_modules/.bin y en la raíz)."

rules:
  proposal:
    - Incluir plan de rollback para cambios riesgosos.
    - KISS + YAGNI — proponer lo mínimo que cumple el requisito, nada especulativo "por si
      acaso". Declarar explícitamente qué queda fuera de alcance y por qué
      (docs/constitucion.md §1).
    - Verificar antes de afirmar. Toda afirmación sobre el estado del repo se acompaña del
      comando que la midió; si no se pudo medir, marcarla como no verificada en vez de
      darla por buena.
  specs:
    - Usar Given/When/Then para los escenarios.
    - Usar keywords RFC 2119 (MUST, SHALL, SHOULD, MAY).
    - Los contratos de error deben espejar el formato real del backend — verificar contra el
      contrato OpenAPI de la feature, que es la autoridad. El formato vigente es RFC 9457
      (application/problem+json), que obsoleta a la RFC 7807.
    - La normativa institucional NO se verifica por Context7 — solo contra el documento
      obtenido de la fuente. Mientras no se obtenga, marcar la afirmación como provisional
      y no auditada (docs/constitucion.md §4).
  design:
    - Mantener la estructura idiomática del App Router (app/ rutas, components/ UI compartida,
      lib/ dominio y datos) — principio 2 de CLAUDE.md y §3 de docs/constitucion.md. No se copia
      el "package-by-layer" del backend, porque su rationale (formación en Spring) no se transfiere.
    - Aplicar atomic design + patrón container/presentational para UI nueva.
    - Explorar al menos una alternativa en un eje DISTINTO antes de elegir. Documentar el
      trade-off no reemplaza haber explorado; variaciones del mismo eje no son alternativas.
    - Documentar decisiones con su trade-off explícito ("elegí X frente a Y, sabiendo que Z").
    - Ante dos soluciones, preferir la que un compañero entienda más rápido en seis meses, no
      la de menos líneas hoy (KISS, docs/constitucion.md §1).
  tasks:
    - Agrupar por fase, numeración jerárquica.
    - Tareas completables en una sesión.
    - El TDD de componentes React ya es posible; @testing-library/react y jsdom están
      instalados y configurados desde 4e63077. NO marcar esas tareas como bloqueadas.
  apply:
    guidelines:
      - Seguir los patrones existentes del repo (container/presentational, atomic design).
      - Conventional commits en español, sin atribución de IA.
      - La validación del frontend es solo UX; la autoritativa es siempre el backend.
      - Minimización de datos personales — openspec/ viaja a un repo PÚBLICO. Ningún artefacto
        —reportes de proceso incluidos— transcribe datos personales reales.
    tdd: true
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Avisar antes de mergear deltas destructivos.
